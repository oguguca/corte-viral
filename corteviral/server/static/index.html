<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Corte Viral</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navegação">
    <div class="brand"><span class="brand-mark" aria-hidden="true">CV</span><b>Corte Viral</b></div>
    <button class="btn primary" id="newVideo" style="margin:0 6px 4px">＋ Novo vídeo</button>
    <div class="side-section t-label">Projetos</div>
    <ul class="side-list" id="projects" aria-label="Projetos"></ul>
    <div class="side-foot">
      <button class="usage-mini" id="usageMini" aria-label="Uso da IA hoje">
        <span class="ring" id="usageRing" aria-hidden="true"></span>
        <span><span class="t-small" style="display:block">Uso da IA hoje</span><b class="num" id="usagePct">—</b></span>
      </button>
      <button class="side-item" id="openSettings"><span class="thumb" aria-hidden="true">⚙</span><span class="meta"><span class="name">Ajustes</span></span></button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="pill" id="pill" role="status" aria-live="polite">
  <div class="top"><span class="spinner" id="pillSpin"></span><span class="stage" id="pillStage"></span>
    <span class="spacer"></span><span class="num t-small" id="pillPct"></span>
    <button class="btn plain small" id="pillClose" hidden>Fechar</button></div>
  <div class="msg" id="pillMsg"></div>
  <div class="track"><i id="pillBar"></i></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tip" id="tip"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
