<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Corte Viral</title>
<script>/* aplica o tema antes de desenhar (sem "piscada" do tema errado) */
try { var t = localStorage.getItem("cv-theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navegação">
    <a class="brand" id="brandHome" href="#/" title="Painel inicial"><span class="brand-mark" aria-hidden="true">CV</span><b>Corte Viral</b></a>
    <button class="btn primary" id="newVideo" style="margin:0 6px 4px">＋ Novo vídeo</button>
    <div class="side-section t-label">Projetos</div>
    <ul class="side-list" id="projects" aria-label="Projetos"></ul>
    <div class="side-foot">
      <div id="themeSlot" style="padding:4px 6px 6px"></div>
      <button class="usage-mini" id="usageMini" aria-label="Uso da IA hoje — abrir detalhes">
        <span class="t-small">Uso da IA hoje</span>
        <span class="u-row"><span>Gemini</span><span class="u-bar"><i id="usageBarG"></i></span><b class="num" id="usagePct">—</b></span>
        <span class="u-row"><span>Groq</span><span class="u-bar"><i id="usageBarQ"></i></span><b class="num" id="usageGroq">—</b></span>
      </button>
      <div class="side-section t-label">Ferramentas</div>
      <a class="side-item" id="openQueue" href="#/fila"><span class="thumb" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span class="meta"><span class="name">Fila de postagem</span><span class="sub" id="queueSub"></span></span></a>
      <button class="side-item" id="openExports" title="Abre no Explorer a pasta com todos os clipes já exportados"><span class="thumb" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="meta"><span class="name">Clipes exportados</span><span class="sub">abrir a pasta</span></span></button>
      <a class="side-item" id="openAccounts" href="#/contas"><span class="thumb" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg></span><span class="meta"><span class="name">Contas conectadas</span></span></a>
      <button class="side-item" id="openSettings"><span class="thumb" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span><span class="meta"><span class="name">Ajustes</span></span></button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="pill" id="pill">
  <div class="top"><span class="spinner" id="pillSpin"></span><span class="stage" id="pillStage" role="status" aria-live="polite"></span>
    <span class="spacer"></span><span class="num t-small" id="pillPct"></span>
    <button class="btn plain small" id="pillClose" hidden>Fechar</button></div>
  <div class="msg" id="pillMsg"></div>
  <div class="track"><i id="pillBar"></i></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tip" id="tip"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
