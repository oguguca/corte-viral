# Copie este arquivo para config.yaml e ajuste o que quiser.
# Chaves omitidas usam o valor padrão mostrado aqui.

paths:
  projects_dir: projects   # onde ficam os projetos (vídeo, áudio, transcrição, clipes)
  models_dir: models       # cache dos modelos de IA

whisper:
  model: medium            # tiny | base | small | medium | large-v3 (medium cabe em 4 GB com int8)
  device: cuda             # cuda | cpu | auto
  compute_type: int8       # int8 economiza VRAM; float16 é mais rápido em GPUs maiores
  language: auto           # auto | pt | en
  beam_size: 5
  vad_filter: true         # pula silêncio (acelera bastante em lives)
  cpu_fallback_model: small  # usado se a GPU falhar (CUDA/VRAM)

analysis:
  profile: viral           # viral (15–60 s) | monetizacao (61–120 s)
  n_clips: 10
  max_candidates: 60
  fetch_chat: true         # baixa o chat gravado da live quando existir
  extra_reactions: {}      # termos extras de reação, ex.: {"eita": 0.8}

llm:
  provider: gemini         # none | gemini (grátis) | anthropic (pago)
  model: null              # null = padrão do provedor (gemini-3.5-flash-lite / claude-opus-5-5)
  batch_size: 8
  daily_request_limit: 1000   # confira sua cota em AI Studio → Rate limits
  daily_token_limit: 1000000
