[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corteviral"
version = "0.1.0"
description = "Transforma lives e VODs longos em clipes verticais prontos para TikTok, Shorts, Reels e Kwai."
requires-python = ">=3.11,<3.12"
dependencies = [
    "faster-whisper>=1.1",
    "yt-dlp[default,curl-cffi]>=2025.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websocket-client>=1.8",
    "anthropic>=2.8",
    "opencv-python-headless>=4.9",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.package-data]
corteviral = ["server/static/*"]

[tool.setuptools.packages.find]
include = ["corteviral*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: testes que usam modelo real / rede"]
addopts = "-m 'not slow'"
